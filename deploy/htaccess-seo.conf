# BEGIN CMK static site
# Paste at the TOP of public_html/.htaccess, above "# BEGIN WordPress" (WordPress rewrites the part between its own markers).
# Checked 2026-11-04: http://www.carbonmonoxidekills.com/facts.html and /index.html answer 200, creating duplicate URLs.
<IfModule mod_rewrite.c>
RewriteEngine On
# One version of every URL: https://www.carbonmonoxidekills.com
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP:X-Forwarded-Proto} !=https
RewriteRule ^ https://www.carbonmonoxidekills.com%{REQUEST_URI} [L,R=301]
RewriteCond %{HTTP_HOST} !^www\.carbonmonoxidekills\.com$ [NC]
RewriteRule ^ https://www.carbonmonoxidekills.com%{REQUEST_URI} [L,R=301]
# The homepage lives at /, not /index.html
RewriteCond %{THE_REQUEST} \s/index\.html[\s?] [NC]
RewriteRule ^index\.html$ https://www.carbonmonoxidekills.com/ [L,R=301]
</IfModule>
# END CMK static site
